name: Build Flashcube (libogc2)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the source code
        uses: actions/checkout@v5

      - name: Download stb_image and mbedTLS
        run: sh get-deps.sh

      - name: Build the .dol
        run: docker run --rm -v "$PWD:/src" -w /src ghcr.io/extremscorner/libogc2:latest make

      - name: Gather files for the SD card
        run: |
          # the app's folder for the card (it goes in sd:/apps): Flashcube as
          # default.dol, its banner, and the files it keeps beside it
          mkdir -p package/flashcube
          cp flashcube.dol package/flashcube/default.dol
          cp dist/opening.bnr package/flashcube/
          cp sd/flashcube/README.txt sd/flashcube/cacert.pem package/flashcube/

      - name: Upload result
        uses: actions/upload-artifact@v6
        with:
          name: flashcube
          path: package/
